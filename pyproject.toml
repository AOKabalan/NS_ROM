[project]
name = "nsrom"
version = "0.1.0"
description = "Local reduced-order modeling framework for bifurcating flows on Firedrake"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "petsc4py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "firedrake: test needs a live Firedrake import / Firedrake objects",
    "slow: test builds meshes/operators or runs solves",
    "nonblocking: never gates the suite (xfail on drift) — e.g. SLEPc eigenvalues",
]

[tool.setuptools.packages.find]
include = ["nsrom*"]
